<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{margin: 20px;}
    </style>
</head>
<body>
    <header>
        <h1>Employee details Form</h1>
    </header>
    <main>
        <form action="">           
        <label for="first">Full Name:</label>
        <input type="text" id="first" name="user name" placeholder="your name"  required><br><br>
        <label for="second">Email:</label>
        <input type="email" id="second" placeholder="your email" name="user email" required><br><br>
        <label for="third">Phone Number:</label>
        <input type="number" id="third" name="user number"required> <br><br>
        <label for="">Gender:</label>
        <input type="radio" id="forth" name="Gender" required value="Male">
        <label for="forth">male</label>
        <input type="radio" id="fiveth" name="Gender" required value="Female">
        <label for="fiveth">Female</label>
        <input type="radio" id="sixth" name="Gender" required value="Other">
        <label for="sixth">Other</label><br><br>
        <label for="seventh">Job Title:</label>
        <input type="text" id="seventh" name="user job title" required><br><br>
        <label for="eight">Department:</label>
        <select name="departament" id="eight">
            <option value="" disabled selected>select your department</option>
            <option value="cse">cse</option>
            <option value="Me">ME</option>
            <option value="IoT">IoT</option>
        </select>
        <br><br>
        <button type="submit">Submit</button>
    </form>
    </main>

</body>
</html>
